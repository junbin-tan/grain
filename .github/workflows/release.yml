# Push a tag like v0.1.0 and this builds Grain.dmg and attaches it to a GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15 # Apple Silicon, matches Grain's only supported platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run sidecars
      - name: Build DMG
        # shortcut: ad-hoc signature ("-"), so users still click "Open Anyway" once; add a Developer ID cert + notarisation to remove that.
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          # The Metal backend uses Clang's runtime for macOS availability checks.
          export RUSTFLAGS="-C link-arg=$(xcrun clang --print-resource-dir)/lib/darwin/libclang_rt.osx.a"
          npx tauri build --bundles dmg
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "v$(jq -r .version src-tauri/tauri.conf.json)"
          mv src-tauri/target/release/bundle/dmg/*.dmg Grain.dmg
          cat > release-notes.md <<EOF
          **[Download Grain for Mac](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Grain.dmg)** · Apple Silicon (M-series), macOS 14 or later

          1. Open Grain.dmg and drag Grain into Applications.
          2. Open Grain from Applications. If macOS blocks the first launch, dismiss the alert, then choose **System Settings → Privacy & Security → Open Anyway**. This build is ad-hoc signed and has not been notarised by Apple.
          3. Follow setup to choose your models and allow microphone and system audio recording. New model downloads need an internet connection. After setup, recording, transcription and notes work offline.
          EOF
          gh release create "$GITHUB_REF_NAME" Grain.dmg --verify-tag \
            --title "Grain $GITHUB_REF_NAME" --notes-file release-notes.md
      - name: Keep DMG as a build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Grain-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
